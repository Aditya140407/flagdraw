<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flag Draw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: signal-flag stripe over a board of players | canvas | chat. Palette borrows maritime signal flags: red, gold, blue on navy ink. */
  :root{
    color-scheme:light; --bg:#EEF2F7; --panel:#FFFFFF; --panel2:#E3EAF4; --ink:#0B1F3A; --muted:#566782; --line:#C8D3E3;
    --red:#D7263D; --gold:#F2B705; --blue:#1F4E9E; --good:#1B7F47; --good-bg:#DDF3E6; --on-red:#FFFFFF;
    --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
    --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#08121F; --panel:#11233C; --panel2:#1A3152; --ink:#EAF0F8; --muted:#92A5C2; --line:#29415F;
    --red:#FF5C70; --gold:#F7C531; --blue:#6B97F0; --good:#53D18B; --good-bg:#12392A; --on-red:#08121F; color-scheme:dark;}}
  :root[data-theme="dark"]{
    --bg:#08121F; --panel:#11233C; --panel2:#1A3152; --ink:#EAF0F8; --muted:#92A5C2; --line:#29415F;
    --red:#FF5C70; --gold:#F7C531; --blue:#6B97F0; --good:#53D18B; --good-bg:#12392A; --on-red:#08121F; color-scheme:dark;}

  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);padding-inline:16px;padding-block:0;overflow-x:hidden}
  *{box-sizing:border-box}
  button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:6px;padding:10px 18px;background:var(--red);color:var(--on-red)}
  button:hover{filter:brightness(1.07)}
  button.sec{background:var(--panel2);color:var(--ink)}
  button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  input[type=text]{font:inherit;padding:11px 13px;border-radius:6px;border:2px solid var(--line);background:var(--panel);color:var(--ink);width:100%}
  .stripe{height:8px;margin-inline:-16px;background:linear-gradient(90deg,var(--red) 0 33.3%,var(--gold) 33.3% 66.6%,var(--blue) 66.6% 100%)}

  /* join screen */
  #join{max-width:440px;margin:6vh auto 0;display:flex;flex-direction:column;gap:14px}
  #join h1{font:800 64px/0.9 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0}
  #join h1 span{color:var(--red)}
  #join p{margin:0;color:var(--muted)}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  #err{min-height:22px;color:var(--red);font-weight:600}
  .note{font-size:13px;color:var(--muted);border-left:4px solid var(--gold);padding-left:10px}

  /* game board */
  #game{height:100%;display:grid;grid-template-columns:190px minmax(0,1fr) 270px;grid-template-rows:auto minmax(0,1fr);gap:10px;padding-block:10px}
  #top{grid-column:1/4;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px}
  #roomtag{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);min-width:0}
  #roomtag b{font:700 22px var(--display);letter-spacing:.14em;color:var(--ink)}
  #roomtag button{padding:4px 10px;font-size:12px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
  .dot.on{background:var(--good)}
  #mid{display:flex;align-items:center;gap:14px;justify-content:center;min-width:0}
  #timer{font:800 30px var(--display);font-variant-numeric:tabular-nums;min-width:52px;height:52px;border-radius:50%;border:4px solid var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
  #hint{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;min-height:42px;align-items:center}
  .tile{width:30px;height:38px;border-bottom:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font:800 28px var(--display);text-transform:uppercase}
  .tile.rev{border-color:var(--red)}
  .gap{width:14px}
  #hintlabel{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
  #roundinfo{text-align:right;font:700 20px var(--display);text-transform:uppercase;letter-spacing:.06em}

  #players{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;overflow:auto;min-height:0}
  #players h3,#side h3{margin:2px 6px 8px;font:700 15px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .pl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;margin-bottom:5px;background:var(--panel2)}
  .pl.guessed{background:var(--good-bg)}
  .pl.me{box-shadow:inset 4px 0 0 var(--gold)}
  .pl .who{min-width:0}
  .pl .nm{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pl small{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .pl .sc{font:800 22px var(--display);font-variant-numeric:tabular-nums}

  #center{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
  #stagewrap{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center}
  #stage{position:relative;width:min(100%,calc((100dvh - 215px) * 1.5));aspect-ratio:3/2;max-width:100%;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden}
  #cv{display:block;width:100%;height:100%;background:#fff;touch-action:none;cursor:crosshair}
  #cv.watch{cursor:default}
  #ov{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 94%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px;overflow:auto}
  #ov h2{margin:0;font:800 40px/1 var(--display);text-transform:uppercase}
  #ov p{margin:0;color:var(--muted);max-width:420px}
  .choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .choices button{font:800 28px var(--display);text-transform:uppercase;padding:14px 24px;letter-spacing:.03em}
  .answer{font:800 64px/1 var(--display);text-transform:uppercase;color:var(--red)}
  .board{width:min(340px,100%);text-align:left}
  .board div{display:flex;justify-content:space-between;padding:8px 12px;background:var(--panel2);border-radius:6px;margin-bottom:5px;font-weight:600}
  .board div:first-child{background:var(--gold);color:#1a1300}

  #tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
  #colors{display:flex;gap:6px;flex-wrap:wrap}
  .sw{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);padding:0}
  .sw.sel{border-color:var(--ink);transform:scale(1.15)}
  #size{width:110px;accent-color:var(--red)}
  #eraser.on{outline:3px solid var(--blue)}
  #tools button{padding:6px 14px}

  #side{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:0;min-width:0}
  #chat{flex:1;overflow:auto;padding:4px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px;min-height:0;overflow-wrap:anywhere}
  .msg b{color:var(--blue)}
  .msg.sys{color:var(--muted);font-style:italic}
  .msg.good{color:var(--good);font-weight:700}
  .msg.priv{color:var(--blue)}
  #gform{padding:10px;border-top:1px solid var(--line)}

  @media (max-width:860px){
    html,body{height:auto}
    #game{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:none}
    #top{grid-column:1;grid-template-columns:1fr auto;grid-template-areas:"room round" "mid mid"}
    #roomtag{grid-area:room} #roundinfo{grid-area:round} #mid{grid-area:mid}
    #players{display:flex;gap:6px;overflow-x:auto} #players h3{display:none} .pl{flex:none;margin:0}
    #stage{width:100%} #stagewrap{flex:none}
    #side{height:300px}
    .tile{width:24px;height:32px;font-size:23px}
    #join h1{font-size:52px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="join">
  <div class="stripe"></div>
  <h1>Flag<br><span>Draw</span></h1>
  <p>Pick a country, draw its flag, and let your friends guess which one it is.</p>
  <div class="field"><label for="name">Your name</label><input type="text" id="name" maxlength="16" placeholder="e.g. Aryan" autocomplete="off"></div>
  <div class="field"><label for="code">Room code (empty creates a new room)</label><input type="text" id="code" maxlength="8" placeholder="e.g. KQ7M" autocomplete="off"></div>
  <button id="joinBtn">Play</button>
  <div id="err" role="alert"></div>
  <div class="note" id="livenote">Send this page's link and your room code to your friends. Nobody needs an account. Players connect directly to each other, so keep the host's tab open during the game.</div>
</div>

<div id="game" hidden>
  <div id="top">
    <div id="roomtag"><span class="dot" id="dot"></span><span>Room</span><b id="roomcode"></b><button class="sec" id="copyBtn" type="button">Copy</button></div>
    <div id="mid"><div id="timer">-</div><div id="hint" aria-live="polite"></div></div>
    <div id="roundinfo"></div>
  </div>
  <div id="players"></div>
  <div id="center">
    <div id="stagewrap">
      <div id="stage">
        <canvas id="cv" width="900" height="600" aria-label="Drawing canvas"></canvas>
        <div id="ov"></div>
      </div>
    </div>
    <div id="tools" hidden>
      <div id="colors"></div>
      <input type="range" id="size" min="2" max="40" value="8" aria-label="Brush size">
      <button class="sec" id="eraser" type="button">Eraser</button>
      <button class="sec" id="clearBtn" type="button">Clear</button>
    </div>
  </div>
  <div id="side">
    <h3>Guesses</h3>
    <div id="chat"></div>
    <form id="gform"><input type="text" id="gin" maxlength="80" placeholder="Type your guess" autocomplete="off"></form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const ROUNDS=3,CHOOSE=15,DRAW=80,REVEAL=5,MAXP=8;
const COUNTRIES=[['Japan'],['France'],['Germany'],['Italy'],['Ireland'],['Poland'],['Ukraine'],['Netherlands','holland'],['Russia'],['Spain'],['Sweden'],['Norway'],['Finland'],['Switzerland'],['Austria'],['Belgium'],['India','bharat'],['Bangladesh'],['China'],['South Korea','korea'],['Canada'],['United States','usa','us','america','united states of america'],['United Kingdom','uk','britain','great britain','england'],['Brazil'],['Argentina'],['Mexico'],['Egypt'],['South Africa'],['Nigeria'],['Turkey','turkiye'],['Greece'],['Portugal'],['Indonesia'],['Thailand'],['Vietnam'],['Pakistan'],['Saudi Arabia'],['Australia'],['New Zealand'],['Colombia'],['Chile'],['Peru'],['Denmark'],['Hungary'],['Romania'],['Bulgaria'],['Czech Republic','czechia'],['Sri Lanka'],['Nepal'],['Kenya'],['Jamaica'],['Cuba'],['Israel'],['Iceland'],['Singapore'],['Philippines'],['Morocco'],['Ghana'],['Ivory Coast','cote divoire'],['Lebanon'],['Estonia'],['Lithuania']];
const COLORS=['#000000','#ffffff','#e11d48','#f97316','#facc15','#22c55e','#166534','#06b6d4','#2563eb','#1e3a8a','#9333ea','#ec4899','#92400e','#9ca3af'];
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const cleanName=s=>String(s||'Player').replace(/[^\p{L}\p{N} _.-]/gu,'').trim().slice(0,16)||'Player';

let nr=null,settled=false,hostPeer=null,iAmHost=false,tickT=null,flushT=null;
let myName='',joinedAt=0,myWord='';
let view={seq:0,phase:'lobby',round:0,rounds:ROUNDS,drawer:null,players:[],hint:'',word:'',choices:[],left:0};
let recvAt=Date.now(),lastSeq=-1,lastSeqPeer=null;
let G=null,HP=null;

// ---------- networking (PeerJS: browsers connect directly, the host relays) ----------
/*NET-START*/
function makeNet(peer,hostId,isHost,presence,hostConn){
  const me=peer.id,handlers={},peerFns=[],connFns=[],roster=new Map(),conns=new Map();
  let connected=true;
  const net={hostId:hostId,isHost:isHost};
  const fire=(topic,from,data)=>{(handlers[topic]||[]).slice().forEach(fn=>{try{fn({topic:topic,data:data,peer:from,sameTab:from===me,isMe:from===me,kind:'viewer',guest:false});}catch(e){}});};
  net.peers=()=>[...roster].map(([id,pr])=>({peer:id,presence:pr,kind:'viewer',isMe:id===me,sameTab:id===me,guest:false}));
  const notifyPeers=()=>{peerFns.slice().forEach(fn=>{try{fn({peers:net.peers()});}catch(e){}});};
  const sendRoster=()=>{const msg={k:'roster',peers:[...roster].map(([id,pr])=>({id:id,pr:pr}))};conns.forEach(c=>{try{c.send(msg);}catch(e){}});notifyPeers();};
  const relay=(topic,from,data)=>{conns.forEach(c=>{try{c.send({k:'ev',topic:topic,data:data,from:from});}catch(e){}});fire(topic,from,data);};
  net.emit=(topic,data)=>{
    if(isHost)relay(topic,me,data);
    else if(hostConn&&hostConn.open)hostConn.send({k:'emit',topic:topic,data:data});
    return Promise.resolve();
  };
  net.on=(topic,fn)=>{(handlers[topic]=handlers[topic]||[]).push(fn);return()=>{handlers[topic]=handlers[topic].filter(f=>f!==fn);};};
  net.onPeers=fn=>{peerFns.push(fn);return()=>{};};
  net.onConnection=fn=>{connFns.push(fn);fn(connected);return()=>{};};
  net.presence=patch=>{
    const cur=Object.assign({},roster.get(me)||{},patch);roster.set(me,cur);
    if(isHost)sendRoster();else if(hostConn&&hostConn.open)hostConn.send({k:'pres',pr:cur});
    return Promise.resolve();
  };
  roster.set(me,presence);
  if(isHost){
    peer.on('connection',conn=>{
      conn.on('data',d=>{
        if(!d||typeof d!=='object')return;
        if(d.k==='hello'){if(conns.size>=MAXP+4)return;conns.set(conn.peer,conn);roster.set(conn.peer,d.pr||{});sendRoster();}
        else if(d.k==='pres'&&conns.has(conn.peer)){roster.set(conn.peer,d.pr||{});sendRoster();}
        else if(d.k==='emit'&&conns.has(conn.peer)&&typeof d.topic==='string')relay(d.topic.slice(0,24),conn.peer,d.data);
      });
      const gone=()=>{if(conns.delete(conn.peer)){roster.delete(conn.peer);sendRoster();}};
      conn.on('close',gone);conn.on('error',gone);
    });
  }else{
    hostConn.on('data',d=>{
      if(!d||typeof d!=='object')return;
      if(d.k==='roster'&&Array.isArray(d.peers)){roster.clear();d.peers.forEach(p=>roster.set(p.id,p.pr||{}));if(!roster.has(me))roster.set(me,presence);notifyPeers();}
      else if(d.k==='ev'&&typeof d.topic==='string')fire(d.topic,d.from,d.data);
    });
    const lost=()=>{connected=false;connFns.forEach(fn=>fn(false));};
    hostConn.on('close',lost);hostConn.on('error',lost);
    hostConn.send({k:'hello',pr:presence});
  }
  return net;
}
/*NET-END*/
function newPeer(id){
  return new Promise((res,rej)=>{
    const p=id?new Peer(id,{debug:0}):new Peer({debug:0});
    const t=setTimeout(()=>rej(new Error('server')),15000);
    p.on('open',()=>{clearTimeout(t);res(p);});
    p.on('error',e=>{clearTimeout(t);rej(new Error(e&&e.type==='unavailable-id'?'taken':'server'));});
  });
}
function openConn(peer,hostId){
  return new Promise((res,rej)=>{
    const conn=peer.connect(hostId,{reliable:true,serialization:'json'});
    const t=setTimeout(()=>rej(new Error('notfound')),12000);
    const onErr=e=>{if(e&&e.type==='peer-unavailable'){clearTimeout(t);rej(new Error('notfound'));}};
    peer.on('error',onErr);
    conn.on('open',()=>{clearTimeout(t);res(conn);});
  });
}
const PREFIX='flagdraw-';
async function createRoom(code,presence){const peer=await newPeer(PREFIX+code);return makeNet(peer,peer.id,true,presence,null);}
async function joinRoom(code,presence){const peer=await newPeer();const conn=await openConn(peer,PREFIX+code);return makeNet(peer,PREFIX+code,false,presence,conn);}

// ---------- join ----------
function makeCode(){const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
let hostLost=false;
async function join(){
  const errEl=$('err');errEl.textContent='';
  const name=cleanName($('name').value);
  let code=$('code').value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
  const creating=!code;
  if(!creating&&code.length<3){errEl.textContent='Room codes have 3 to 8 letters or numbers.';return;}
  if(typeof Peer==='undefined'){errEl.textContent='Could not load the networking library. Check your internet connection and reload the page.';return;}
  $('joinBtn').disabled=true;$('joinBtn').textContent='Connecting...';
  const presence={name:name,t:Date.now()};
  try{
    if(creating){
      for(let i=0;i<6&&!nr;i++){code=makeCode();try{nr=await createRoom(code,presence);}catch(e){if(e.message!=='taken')throw e;}}
      if(!nr)throw new Error('server');
    }else nr=await joinRoom(code,presence);
  }catch(e){
    errEl.textContent=e.message==='notfound'?'Room '+code+' was not found. Check the code, and make sure the host still has the game open.':'Could not reach the matchmaking service. Check your internet connection and try again.';
    $('joinBtn').disabled=false;$('joinBtn').textContent='Play';nr=null;return;
  }
  myName=name;joinedAt=presence.t;
  $('roomcode').textContent=code;
  $('join').hidden=true;$('game').hidden=false;
  nr.on('state',onState);nr.on('draw',onDraw);nr.on('clear',onClear);nr.on('pick',onPick);
  nr.on('guess',m=>{if(iAmHost)hostGuess(m);});nr.on('msg',onMsg);nr.on('secret',onSecret);
  nr.onPeers(onPeers);
  nr.onConnection(c=>{$('dot').classList.toggle('on',c);if(!c&&!nr.isHost){hostLost=true;render();}});
  settled=true;evalHost();render();
}
$('joinBtn').onclick=join;
['name','code'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')join();}));
$('copyBtn').onclick=()=>{const t=$('roomcode').textContent;try{navigator.clipboard.writeText(t).then(()=>{$('copyBtn').textContent='Copied';setTimeout(()=>$('copyBtn').textContent='Copy',1500);}).catch(()=>{});}catch(e){}};

const out=(t,d)=>{if(nr)nr.emit(t,d).catch(()=>{});};
function myPeer(){const m=nr&&nr.peers().find(p=>p.isMe&&p.sameTab);return m?m.peer:null;}
function peersList(){return nr?nr.peers().filter(p=>p.kind==='viewer'&&p.presence&&p.presence.name):[];}
function computeHost(){
  const ps=peersList().slice().sort((a,b)=>(a.presence.t-b.presence.t)||(a.peer<b.peer?-1:1));
  return ps.length?ps[0].peer:null;
}

// ---------- host election ----------
function onPeers(){ evalHost(); if(iAmHost)reconcile(); else render(); }
function evalHost(){
  if(!nr)return;
  const was=iAmHost;
  hostPeer=nr.hostId;iAmHost=!!nr.isHost;
  if(iAmHost&&!was)becomeHost();
}
function becomeHost(){
  G={seq:view.seq||0,phase:'lobby',round:0,rounds:ROUNDS,drawer:null,players:[],word:''};
  HP={queue:[],turn:-1,used:new Set(),choices:[],country:null,revealed:new Set(),hintStage:0,endsAt:0};
  const carried=view.players||[];
  carried.forEach(p=>{G.players.push({id:p.id,name:p.name,score:p.score,guessed:false});});
  if(view.phase!=='lobby'&&view.phase!=='end'&&carried.length)sys('The host left. Back to the lobby with scores kept.');
  G.seq+=10;
  clearInterval(tickT);tickT=setInterval(hostTick,1000);
  reconcile();publish();
}
function stopHost(){clearInterval(tickT);tickT=null;G=null;HP=null;}

// ---------- host game logic ----------
const left=()=>HP&&HP.endsAt?Math.max(0,Math.ceil((HP.endsAt-Date.now())/1000)):0;
function sys(text){out('msg',{k:'sys',text});}
function chat(o){out('msg',o);}
function maskHint(){
  if(!HP.country)return '';
  return [...HP.country.name].map((ch,i)=>ch===' '?' ':(HP.revealed.has(i)?ch:'_')).join('');
}
function publish(){
  if(!G||!iAmHost)return;
  G.seq++;
  const ph=G.phase;
  const o={seq:G.seq,phase:ph,round:G.round,rounds:ROUNDS,drawer:G.drawer,
    players:G.players.map(p=>({id:p.id,name:p.name,score:p.score,guessed:p.guessed,host:p.id===hostPeer})),
    hint:ph==='drawing'?maskHint():'',word:(ph==='reveal'||ph==='end')?(G.word||''):'',
    choices:ph==='choosing'?HP.choices.map(c=>c.name):[],left:left()};
  view=o;recvAt=Date.now();render();out('state',o);
}
function reconcile(){
  if(!iAmHost||!G)return;
  const ps=peersList(),ids=new Set(ps.map(p=>p.peer));
  let changed=false;
  ps.forEach(p=>{
    if(!G.players.find(x=>x.id===p.peer)&&G.players.length<MAXP){
      const nm=cleanName(p.presence.name);G.players.push({id:p.peer,name:nm,score:0,guessed:false});sys(nm+' joined.');changed=true;}
  });
  const gone=G.players.filter(x=>!ids.has(x.id));
  if(gone.length){G.players=G.players.filter(x=>ids.has(x.id));gone.forEach(g=>sys(g.name+' left.'));changed=true;}
  const active=G.phase==='choosing'||G.phase==='drawing'||G.phase==='reveal';
  if(active&&G.players.length<2){G.phase='lobby';G.drawer=null;HP.endsAt=0;out('clear',{});sys('Not enough players. Back to the lobby.');publish();return;}
  if(gone.some(g=>g.id===G.drawer)){
    if(G.phase==='choosing'){nextTurn();return;}
    if(G.phase==='drawing'){endTurn();return;}
  }
  if(changed)publish();
}
function startGame(){
  if(!iAmHost||!G||G.players.length<2||(G.phase!=='lobby'&&G.phase!=='end'))return;
  G.players.forEach(p=>{p.score=0;p.guessed=false;});
  HP.queue=[];
  for(let r=1;r<=ROUNDS;r++)shuffle(G.players.map(p=>p.id)).forEach(id=>HP.queue.push({id,r}));
  HP.turn=-1;HP.used=new Set();nextTurn();
}
function nextTurn(){
  HP.turn++;
  while(HP.turn<HP.queue.length&&!G.players.find(p=>p.id===HP.queue[HP.turn].id))HP.turn++;
  if(HP.turn>=HP.queue.length){G.phase='end';G.drawer=null;HP.endsAt=0;G.word='';publish();return;}
  const t=HP.queue[HP.turn];
  G.drawer=t.id;G.round=t.r;G.word='';HP.country=null;
  G.players.forEach(p=>p.guessed=false);
  let pool=COUNTRIES.filter(c=>!HP.used.has(c[0]));
  if(pool.length<3){HP.used.clear();pool=COUNTRIES;}
  HP.choices=shuffle(pool).slice(0,3).map(c=>({name:c[0],alts:c.map(norm)}));
  G.phase='choosing';HP.endsAt=Date.now()+CHOOSE*1000;
  out('clear',{});
  const d=G.players.find(p=>p.id===G.drawer);
  sys((d?d.name:'Someone')+' is choosing a flag...');
  publish();
}
function beginDrawing(choice){
  HP.country=choice;HP.used.add(choice.name);HP.revealed=new Set();HP.hintStage=0;
  G.phase='drawing';G.word=choice.name;HP.endsAt=Date.now()+DRAW*1000;
  out('secret',{to:G.drawer,word:choice.name});
  const d=G.players.find(p=>p.id===G.drawer);
  sys((d?d.name:'Someone')+' is drawing. The country has '+choice.name.replace(/ /g,'').length+' letters.');
  publish();
}
function endTurn(){
  G.phase='reveal';HP.endsAt=Date.now()+REVEAL*1000;
  G.word=HP.country?HP.country.name:'?';
  sys('The country was '+G.word+'.');
  publish();
}
function revealLetter(){
  const n=HP.country.name;
  const idx=[...n].map((c,i)=>i).filter(i=>n[i]!==' '&&!HP.revealed.has(i));
  if(idx.length>2)HP.revealed.add(idx[Math.floor(Math.random()*idx.length)]);
}
function hostTick(){
  if(!G||!iAmHost)return;
  if(G.phase==='drawing'){
    const frac=left()/DRAW;
    if(HP.hintStage===0&&frac<=0.5){HP.hintStage=1;revealLetter();}
    else if(HP.hintStage===1&&frac<=0.25){HP.hintStage=2;revealLetter();}
  }
  const timed=G.phase==='choosing'||G.phase==='drawing'||G.phase==='reveal';
  if(timed&&left()<=0){
    if(G.phase==='choosing')beginDrawing(HP.choices[Math.floor(Math.random()*HP.choices.length)]);
    else if(G.phase==='drawing')endTurn();
    else nextTurn();
    return;
  }
  reconcile();publish();
}
function hostGuess(m){
  if(!G)return;
  const p=G.players.find(x=>x.id===m.peer);if(!p)return;
  const text=String((m.data&&m.data.text)||'').trim().slice(0,80);if(!text)return;
  if(G.phase==='drawing'&&p.id!==G.drawer&&!p.guessed){
    if(HP.country&&HP.country.alts.includes(norm(text))){
      const pts=Math.round(50+450*left()/DRAW);
      p.score+=pts;p.guessed=true;
      const d=G.players.find(x=>x.id===G.drawer);if(d)d.score+=60;
      chat({k:'good',text:p.name+' guessed the country! (+'+pts+')'});
      if(G.players.filter(x=>x.id!==G.drawer).every(x=>x.guessed))endTurn();else publish();
      return;
    }
    chat({k:'chat',name:p.name,text:text});
  }else if(G.phase==='drawing'&&(p.guessed||p.id===G.drawer)){
    chat({k:'chat',name:p.name,text:text,priv:true});
  }else chat({k:'chat',name:p.name,text:text});
}
function onPick(m){
  if(!iAmHost||!G||G.phase!=='choosing'||m.peer!==G.drawer)return;
  const i=+(m.data&&m.data.i);
  if(HP.choices[i])beginDrawing(HP.choices[i]);
}

// ---------- client handlers ----------
function onState(m){
  if(m.sameTab)return;
  if(settled&&hostPeer&&m.peer!==hostPeer)return;
  const d=m.data;if(!d||typeof d.seq!=='number'||!Array.isArray(d.players))return;
  if(m.peer===lastSeqPeer&&d.seq<lastSeq)return;
  lastSeqPeer=m.peer;lastSeq=d.seq;
  if(d.phase==='choosing'&&view.phase!=='choosing')myWord='';
  view=d;recvAt=Date.now();render();
}
function onSecret(m){const d=m.data;if(d&&d.to&&d.to===myPeer()){myWord=String(d.word||'');render();}}
function onMsg(m){
  const d=m.data||{};
  if(d.priv){
    const me=view.players.find(p=>p.id===myPeer());
    if(!(view.drawer===myPeer()||(me&&me.guessed)))return;
  }
  const text=String(d.text||'').slice(0,120);
  addChat(d.k==='sys'||d.k==='good'?text:String(d.name||'?').slice(0,16)+': '+text,d.k,!!d.priv);
}
function onClear(m){
  if(m.peer!==view.drawer&&m.peer!==hostPeer)return;
  clearCanvas();lastPt=null;
}
function onDraw(m){
  if(m.sameTab||m.peer!==view.drawer)return;
  paintBatch(m.data);
}
function addChat(text,k,priv){
  const d=document.createElement('div');d.className='msg '+(k||'')+(priv?' priv':'');
  const i=text.indexOf(': ');
  if(k==='chat'&&i>0){const b=document.createElement('b');b.textContent=text.slice(0,i+1)+' ';d.append(b,document.createTextNode(text.slice(i+2)));}
  else d.textContent=text;
  const c=$('chat');c.appendChild(d);while(c.children.length>150)c.removeChild(c.firstChild);c.scrollTop=c.scrollHeight;
}

// ---------- rendering ----------
function curLeft(){return Math.max(0,view.left-Math.floor((Date.now()-recvAt)/1000));}
function renderTimer(){
  const t=$('timer');
  t.textContent=(view.phase==='lobby'||view.phase==='end')?'-':curLeft();
}
setInterval(renderTimer,250);
function setHint(text,revealedStyle){
  const h=$('hint');h.textContent='';
  [...text].forEach(ch=>{
    const s=document.createElement('span');
    if(ch===' ')s.className='gap';
    else{s.className='tile'+(revealedStyle&&ch!=='_'?' rev':'');s.textContent=ch==='_'?'':ch;}
    h.appendChild(s);
  });
}
function render(){
  const me=myPeer();
  const iDraw=view.drawer===me&&me!==null&&(view.phase==='choosing'||view.phase==='drawing');
  renderTimer();
  $('roundinfo').textContent=view.phase==='lobby'?'Lobby':view.phase==='end'?'Final':'Round '+view.round+' of '+view.rounds;
  if(view.phase==='drawing'){
    if(iDraw&&myWord)setHint(myWord,true);
    else setHint(view.hint,false);
  }else if(view.phase==='reveal'){setHint(view.word,true);}
  else $('hint').textContent='';
  const pl=$('players');pl.textContent='';
  const h3=document.createElement('h3');h3.textContent='Players';pl.appendChild(h3);
  view.players.slice().sort((a,b)=>b.score-a.score).forEach(p=>{
    const d=document.createElement('div');d.className='pl'+(p.guessed?' guessed':'')+(p.id===me?' me':'');
    const w=document.createElement('div');w.className='who';
    const n=document.createElement('span');n.className='nm';n.textContent=p.name+(p.id===me?' (you)':'');w.appendChild(n);
    const tag=[];
    if(p.id===view.drawer&&(view.phase==='choosing'||view.phase==='drawing'||view.phase==='reveal'))tag.push('drawing');
    if(p.guessed)tag.push('guessed');
    if(p.host)tag.push('host');
    if(tag.length){const s=document.createElement('small');s.textContent=tag.join(' / ');w.appendChild(s);}
    const sc=document.createElement('span');sc.className='sc';sc.textContent=p.score;
    d.append(w,sc);pl.appendChild(d);
  });
  const draw=iDraw&&view.phase==='drawing';
  $('tools').hidden=!draw;
  $('cv').classList.toggle('watch',!draw);
  $('gin').placeholder=iDraw?'Chat (keep the country secret)':'Type your guess';
  renderOverlay(iDraw,me);
}
function renderOverlay(iDraw,me){
  const ov=$('ov');ov.textContent='';
  const el=(tag,txt,cls)=>{const e=document.createElement(tag);if(txt)e.textContent=txt;if(cls)e.className=cls;ov.appendChild(e);return e;};
  const amIn=view.players.some(p=>p.id===me);
  if(hostLost){
    el('h2','Host left');el('p','The host closed the game. Reload the page to start or join another room.');ov.hidden=false;return;
  }
  if(!settled||(view.players.length===0&&view.phase==='lobby')){
    el('h2','Connecting');el('p','Looking for the other players in room '+$('roomcode').textContent+'.');
  }else if(view.phase==='lobby'){
    el('h2','Waiting for players');
    el('p','Share room code '+$('roomcode').textContent+' with your friends. '+view.players.length+' in the room, at least 2 needed.');
    if(iAmHost){const b=el('button','Start game');b.disabled=view.players.length<2;b.onclick=startGame;}
    else el('p','The host starts the game.');
  }else if(view.phase==='choosing'){
    if(iDraw){
      el('h2','Choose a flag to draw');
      const c=el('div','','choices');
      view.choices.forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>{myWord=name;out('pick',{i});};c.appendChild(b);});
      el('p','A random one is picked when the time runs out.');
    }else{
      const d=view.players.find(p=>p.id===view.drawer);
      el('h2',(d?d.name:'Someone')+' is choosing');el('p','Get ready to guess the country from the flag.');
    }
  }else if(view.phase==='reveal'){
    el('p','The country was');el('div',view.word,'answer');
  }else if(view.phase==='end'){
    el('h2','Final scores');
    const b=el('div','','board');
    view.players.slice().sort((x,y)=>y.score-x.score).forEach((p,i)=>{const r=document.createElement('div');const a=document.createElement('span');a.textContent=(i+1)+'. '+p.name;const s=document.createElement('span');s.textContent=p.score;r.append(a,s);b.appendChild(r);});
    if(iAmHost){const btn=el('button','Play again');btn.onclick=startGame;}
    else el('p','The host can start another game.');
  }
  ov.hidden=(view.phase==='drawing');
  if(!amIn&&view.phase!=='lobby'&&view.phase!=='drawing'&&settled){}
}

// ---------- canvas ----------
const cv=$('cv'),ctx=cv.getContext('2d');const W=cv.width,H=cv.height;
let lastPt=null,drawing=false,buf=[],strokeNew=true,cur={c:'#000000',w:8},color='#000000',size=8,erasing=false;
function clearCanvas(){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);}
clearCanvas();
function paintPoint(x,y,c,w,start){
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=w;
  if(start||!lastPt){ctx.beginPath();ctx.arc(x,y,w/2,0,Math.PI*2);ctx.fill();}
  else{ctx.beginPath();ctx.moveTo(lastPt.x,lastPt.y);ctx.lineTo(x,y);ctx.stroke();}
  lastPt={x,y};
}
function paintBatch(b){
  if(!b||!Array.isArray(b.p)||b.p.length>400)return;
  const c=/^#[0-9a-f]{3,8}$/i.test(String(b.c))?String(b.c):'#000000';
  const w=Math.min(60,Math.max(1,+b.w||4))*(W/900);
  b.p.forEach((pt,i)=>{
    if(!Array.isArray(pt))return;
    const x=+pt[0],y=+pt[1];if(!isFinite(x)||!isFinite(y))return;
    paintPoint(x/1000*W,y/1000*H,c,w,!!b.n&&i===0);
  });
}
function pos(ev){
  const r=cv.getBoundingClientRect();
  return {x:Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width)),y:Math.min(1,Math.max(0,(ev.clientY-r.top)/r.height))};
}
function canDraw(){return view.phase==='drawing'&&view.drawer===myPeer()&&myPeer()!==null;}
function flush(){
  clearTimeout(flushT);flushT=null;
  if(!buf.length)return;
  out('draw',{c:cur.c,w:cur.w,n:strokeNew,p:buf});
  strokeNew=false;buf=[];
}
function addPoint(p,start){
  const c=erasing?'#ffffff':color,w=erasing?size*2:size;
  if(start){flush();cur={c,w};strokeNew=true;}
  paintPoint(p.x*W,p.y*H,cur.c,cur.w*(W/900),start);
  buf.push([Math.round(p.x*1000),Math.round(p.y*1000)]);
  if(buf.length>=150)flush();else if(!flushT)flushT=setTimeout(flush,90);
}
cv.addEventListener('pointerdown',ev=>{if(!canDraw())return;drawing=true;cv.setPointerCapture(ev.pointerId);lastPt=null;addPoint(pos(ev),true);});
cv.addEventListener('pointermove',ev=>{if(drawing&&canDraw())addPoint(pos(ev),false);});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>{if(drawing){flush();}drawing=false;lastPt=null;}));
COLORS.forEach((c,i)=>{
  const b=document.createElement('button');b.type='button';b.className='sw'+(i===0?' sel':'');b.style.background=c;b.setAttribute('aria-label','Colour '+c);
  b.onclick=()=>{color=c;erasing=false;$('eraser').classList.remove('on');document.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');};
  $('colors').appendChild(b);
});
$('size').oninput=e=>{size=+e.target.value;};
$('eraser').onclick=()=>{erasing=!erasing;$('eraser').classList.toggle('on',erasing);};
$('clearBtn').onclick=()=>{if(!canDraw())return;flush();clearCanvas();lastPt=null;out('clear',{});};

// ---------- guessing ----------
$('gform').addEventListener('submit',e=>{
  e.preventDefault();
  const t=$('gin').value.trim();if(!t)return;
  out('guess',{text:t});$('gin').value='';
});
render();
})();
</script>
</body>
</html>
